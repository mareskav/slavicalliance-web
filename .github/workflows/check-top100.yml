
name: Check league top 100
on:
  schedule:
    - cron: "37 9 * * 2"          # Tue 09:37 Europe/Prague
      timezone: "Europe/Prague"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with: { sparse-checkout: scripts/check_top100.py, sparse-checkout-cone-mode: false }
      - run: python3 scripts/check_top100.py --league-id 178 --top 100
# No secrets, no DATABASE_URL. A failed scheduled run emails the owner by default.
