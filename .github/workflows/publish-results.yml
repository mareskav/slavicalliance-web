name: Publish results snapshots

on:
  schedule:
    # Shortly after the quiz-scrapper sync (12:17 Europe/Prague). One run a day
    # keeps Neon network transfer down; update-results.ps1 publishes on its own.
    - cron: "45 12 * * *"
      timezone: "Europe/Prague"
  # Manual trigger only: saving a manual result no longer dispatches a full
  # publish (the incremental patch already updates the team snapshot and index).
  workflow_dispatch:

permissions:
  contents: read

# Runs queue (at most one pending) instead of cancelling, so a burst of admin
# saves ends in a single publish that sees the latest data.
concurrency:
  group: publish-results
  cancel-in-progress: false

jobs:
  publish:
    name: Publish snapshots to R2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: slavicalliance-results-data

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Publish snapshots
        run: npm run publish:results
